appId: dev.omerovic.orbit
productName: Orbit
copyright: Copyright © 2026 Arman Omerovic
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - node_modules/node-pty/**
  - resources/**
# Native modules are prepared per platform: macOS builds node-pty for Electron in
# postinstall; Windows uses node-pty's bundled N-API prebuilds; Linux is built
# inside a Linux container (scripts/build-linux.sh).
npmRebuild: false
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# Auto-update reads latest*.yml from GitHub Releases (see src/main/updater.ts).
publish:
  provider: github
  owner: FlaShadowK
  repo: orbit

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
    # the in-app updater downloads this zip and swaps the app bundle
    - target: zip
      arch: [arm64, x64]
  extendInfo:
    NSAppleEventsUsageDescription: Orbit runs your shell and developer tools.
dmg:
  title: ${productName} ${version}
  icon: build/icon.icns            # volume icon when mounted
  background: build/background.tiff  # 1x+2x, rendered by scripts/render-dmg-background.sh
  format: ULFO                     # lzfse: smaller, fast to open (macOS 10.11+)
  iconSize: 112
  iconTextSize: 13
  window: { width: 660, height: 400 }
  contents:
    - { x: 170, y: 200 }
    - { x: 490, y: 200, type: link, path: /Applications }

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Orbit
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

linux:
  icon: build/icon.png
  category: Development
  maintainer: Arman Omerovic <oarman93@gmail.com>
  synopsis: Agentic development & devops workspace
  description: Agents, terminals, editor and SSH servers in one app.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  desktop:
    entry:
      StartupWMClass: Orbit
  syncDesktopName: true
