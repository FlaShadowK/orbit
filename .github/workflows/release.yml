name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # no Apple Developer certificate in CI: ad-hoc sign so the bundle stays intact
            # (unsigned/broken signatures show up as "Orbit is damaged" on Apple Silicon)
            cmd: npx electron-builder --mac --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
          - os: windows-latest
            cmd: npx electron-builder --win --publish never
          - os: ubuntu-latest
            cmd: npx electron-builder --linux --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci --ignore-scripts
      - name: Prepare native modules for Electron
        shell: bash
        run: |
          rm -rf node_modules/cpu-features   # optional ssh2 speed-up, not needed
          node scripts/fix-node-pty.cjs
          npx electron-builder install-app-deps
      - run: npm run typecheck && npm test
      - run: npm run build
      - run: ${{ matrix.cmd }}
        env:
          # no signing certificates in CI yet; don't search the runner's keychain
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-${{ matrix.os }}
          # installers + what the in-app updater needs (latest*.yml, mac zips, blockmaps)
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
