<!doctype html>
<!-- Source of build/background.tiff (DMG window background). Re-render with scripts/render-dmg-background.sh -->
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#07080e}
  svg{display:block}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171b3a"/>
      <stop offset="1" stop-color="#06070d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#5b5cff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#3b2fbf" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="slot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b9bff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b9bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#9db8ff"/>
      <stop offset="0.82" stop-color="#c792ea"/>
      <stop offset="1" stop-color="#c792ea" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7ceff"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#99f6e4"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="softer" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <rect width="660" height="400" fill="url(#bg)"/>
  <rect width="660" height="400" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="42" cy="38" r="1.2" opacity=".55"/><circle cx="118" cy="92" r=".8" opacity=".4"/>
    <circle cx="206" cy="30" r="1" opacity=".35"/><circle cx="268" cy="118" r=".7" opacity=".3"/>
    <circle cx="402" cy="26" r="1.3" opacity=".5"/><circle cx="470" cy="104" r=".8" opacity=".35"/>
    <circle cx="560" cy="50" r="1.1" opacity=".45"/><circle cx="624" cy="128" r=".9" opacity=".4"/>
    <circle cx="30" cy="232" r=".8" opacity=".3"/><circle cx="636" cy="262" r="1.2" opacity=".45"/>
    <circle cx="74" cy="344" r="1" opacity=".35"/><circle cx="168" cy="378" r=".7" opacity=".3"/>
    <circle cx="512" cy="372" r="1" opacity=".35"/><circle cx="596" cy="340" r=".8" opacity=".3"/>
    <circle cx="330" cy="300" r=".7" opacity=".25"/><circle cx="610" cy="200" r=".8" opacity=".3"/>
  </g>
  <g fill="#c7ceff" opacity=".8">
    <path d="M590 84 l1.6 4.4 4.4 1.6 -4.4 1.6 -1.6 4.4 -1.6 -4.4 -4.4 -1.6 4.4 -1.6z" opacity=".55"/>
    <path d="M78 150 l1.2 3.3 3.3 1.2 -3.3 1.2 -1.2 3.3 -1.2 -3.3 -3.3 -1.2 3.3 -1.2z" opacity=".45"/>
  </g>

  <!-- title -->
  <text x="330" y="62" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif"
        font-size="30" font-weight="700" letter-spacing="0.5" fill="url(#title)">Orbit</text>
  <text x="330" y="86" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif"
        font-size="11.5" font-weight="500" letter-spacing="2.4" fill="#7f88b5">AGENTIC DEV &amp; DEVOPS WORKSPACE</text>

  <!-- soft halos behind the two icon slots (icons at x=170 / x=490, y=200) -->
  <circle cx="170" cy="200" r="92" fill="url(#slot)"/>
  <circle cx="490" cy="200" r="92" fill="url(#slot)"/>

  <!-- orbit ring through both icons: glow + crisp line -->
  <ellipse cx="330" cy="204" rx="300" ry="62" fill="none" stroke="url(#ring)" stroke-width="6" opacity=".35" filter="url(#soft)"/>
  <ellipse cx="330" cy="204" rx="300" ry="62" fill="none" stroke="url(#ring)" stroke-width="1.4" opacity=".75"/>

  <!-- moon riding the ring -->
  <circle cx="330" cy="142" r="9" fill="#5eead4" opacity=".55" filter="url(#soft)"/>
  <circle cx="330" cy="142" r="4.2" fill="url(#moon)"/>

  <!-- arrow: three chevrons fading in toward Applications -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#9db8ff" stroke-width="5" opacity=".35" filter="url(#softer)">
      <path d="M300 186 l14 14 -14 14"/><path d="M324 186 l14 14 -14 14"/><path d="M348 186 l14 14 -14 14"/>
    </g>
    <path d="M300 186 l14 14 -14 14" stroke="#5eead4" stroke-width="3" opacity=".45"/>
    <path d="M324 186 l14 14 -14 14" stroke="#9db8ff" stroke-width="3" opacity=".72"/>
    <path d="M348 186 l14 14 -14 14" stroke="#c792ea" stroke-width="3" opacity="1"/>
  </g>

  <!-- footer hint -->
  <text x="330" y="356" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif"
        font-size="12.5" font-weight="500" fill="#8a93c2">Drag <tspan fill="#e6e9ff" font-weight="600">Orbit</tspan> into <tspan fill="#e6e9ff" font-weight="600">Applications</tspan> to install</text>
</svg>
</body></html>
